<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastel Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">

  <link href="src/output.css" rel="stylesheet">
</head>
<body class="bg-[#e8dfd9] min-h-screen flex flex-col justify-center items-center p-4">

  <div id="calculator" class="w-full max-w-[430px] bg-white rounded-[36px] p-6 shadow-2xl">
    <div class="h-[190px] bg-[#f8dede] rounded-[32px] p-6 flex flex-col justify-end mb-6">
      <p id="expression" class="text-right text-sm text-gray-500 break-all mb-2 h-5"></p>
      <input type="text" id="display" readonly dir="ltr"
        class="w-full bg-transparent outline-none text-right text-5xl text-[#3d2c2c] font-light overflow-x-auto whitespace-nowrap leading-none">

    </div>
    <div class="grid grid-cols-4 gap-4">
      <button class="btn bg-[#f6ddb0]">AC</button>
      <button class="btn bg-[#f9dddd]">( )</button>
      <button class="btn bg-[#f9dddd]">%</button>
      <button class="btn bg-[#f9dddd]">÷</button>

      <button class="btn bg-[#f8f1f1]">7</button>
      <button class="btn bg-[#f8f1f1]">8</button>
      <button class="btn bg-[#f8f1f1]">9</button>
      <button class="btn bg-[#f9dddd]">×</button>

      <button class="btn bg-[#f8f1f1]">4</button>
      <button class="btn bg-[#f8f1f1]">5</button>
      <button class="btn bg-[#f8f1f1]">6</button>
      <button class="btn bg-[#f9dddd]">-</button>

      <button class="btn bg-[#f8f1f1]">1</button>
      <button class="btn bg-[#f8f1f1]">2</button>
      <button class="btn bg-[#f8f1f1]">3</button>
      <button class="btn bg-[#f9dddd]">+</button>

      <button class="btn bg-[#f8f1f1]">0</button>
      <button class="btn bg-[#f8f1f1]">.</button>
      <button class="btn bg-[#f8f1f1]">⌫</button>
      <button class="btn bg-[#f9dddd]">=</button>
    </div>

    
  </div>

                Zahra Khanezad

            <!-- Social -->

                <a href="https://github.com/zahraDiv"
                    class="w-12 h-12 sm:w-14 sm:h-14 md:w-16 md:h-16 rounded-2xl bg-white shadow-lg flex items-center justify-center text-xl sm:text-2xl md:text-3xl text-gray-700 transition duration-300 hover:scale-110 hover:bg-violet-600 hover:text-white">
                    <i class="ri-github-fill"></i>
                </a>

                <a href="https://www.linkedin.com/in/zahrakh-dev"
                    class="w-12 h-12 sm:w-14 sm:h-14 md:w-16 md:h-16 rounded-2xl bg-white shadow-lg flex items-center justify-center text-xl sm:text-2xl md:text-3xl text-gray-700 transition duration-300 hover:scale-110 hover:bg-blue-600 hover:text-white">
                    <i class="ri-linkedin-box-fill"></i>
                </a>

                <a href="https://www.instagram.com/zahrakh__dev/"
                    class="w-12 h-12 sm:w-14 sm:h-14 md:w-16 md:h-16 rounded-2xl bg-white shadow-lg flex items-center justify-center text-xl sm:text-2xl md:text-3xl text-gray-700 transition duration-300 hover:scale-110 hover:bg-pink-500 hover:text-white">
                    <i class="ri-instagram-line"></i>

                <a href="mailto:Zahrakhanezad12@gmail.com"

        </div>

    </div>
</footer>

</body>
